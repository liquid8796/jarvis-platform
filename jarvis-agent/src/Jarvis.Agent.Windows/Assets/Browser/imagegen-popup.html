<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis ImageGen</title>
<style>
:root{color-scheme:dark;font:13px system-ui,sans-serif;background:#11151f;color:#eef0f7}body{width:350px;margin:0;padding:18px;box-sizing:border-box}h1{font-size:18px;margin:0 0 8px}p{line-height:1.5;color:#b5bed0}button,select{font:inherit;box-sizing:border-box;border:1px solid #65558b;border-radius:7px;padding:9px;background:#28213e;color:#fff;margin:5px 0;width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #bda7f5;outline-offset:2px}small{display:block;overflow-wrap:anywhere;color:#b5bed0}hr{border:0;border-top:1px solid #354052;margin:16px 0}label{display:block;line-height:1.5;margin:8px 0}#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#d7ceef}#disconnect{background:#271e27}input{margin-right:6px}
</style></head><body>
<h1>Jarvis ImageGen</h1>
<p>Use ChatGPT in this Chrome/Edge profile. No separate browser, cookie import or paid API fallback.</p>
<small id="browser">Reading browser connection…</small>
<button id="bind">Use this browser for ImageGen</button>
<button id="disconnect">Remove this browser binding</button>
<hr>
<label for="session">Assign this image-only ChatGPT tab to a Jarvis session</label>
<select id="session" aria-label="Jarvis session"></select>
<label><input id="confirmed" type="checkbox">This is an image-only conversation, not the chat controlling Jarvis. Jarvis may upload the selected images and submit prompts here.</label>
<button id="adopt">Assign current tab</button>
<small>Normally Jarvis creates its own tab in this existing browser. Assigning a tab is optional. Your other tabs and conversations are not imported or deleted.</small>
<p id="status" role="status" aria-live="polite"></p>
<script src="imagegen-popup.js"></script>
</body></html>
