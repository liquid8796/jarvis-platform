name: jarvis-build
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  server-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Jarvis.Core.Tests -c Release --logger trx --results-directory artifacts/test-results
      - run: dotnet test tests/Jarvis.Server.Tests -c Release --logger trx --results-directory artifacts/test-results
      - run: dotnet publish jarvis-mcp-server/src/Jarvis.McpServer -c Release -r linux-arm64 --self-contained true -o artifacts/server/linux-arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: artifacts/test-results
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: ./scripts/Build.ps1 -Component Agent
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Agent-win-x64
          path: artifacts/Jarvis-Agent-1.0.16-win-x64.zip
